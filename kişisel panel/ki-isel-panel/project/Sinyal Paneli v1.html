<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinyal Paneli — Lezzet</title>
<link rel="stylesheet" href="lezzet.css">
<style>
  /* ---------- Reset / base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--lz-font-sans);
    background: var(--lz-bg);
    color: var(--lz-text);
    font-size: var(--lz-fs-body);
    line-height: var(--lz-lh-normal);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ul, ol { margin: 0; padding: 0; list-style: none; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(90deg, var(--lz-topbar-from), var(--lz-topbar-to));
    color: var(--lz-text-onbrand);
    box-shadow: var(--lz-shadow-lg);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 12px var(--lz-space-7);
    display: flex; align-items: center; gap: var(--lz-space-6);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-tile {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--lz-primary), var(--lz-gold));
    display: grid; place-items: center; font-size: 18px;
    box-shadow: var(--lz-shadow-cta);
  }
  .brand-name {
    font-weight: 700; font-size: var(--lz-fs-h3); letter-spacing: -0.2px;
  }
  .brand-sub {
    font-size: var(--lz-fs-2xs); color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: var(--lz-tracking-eyebrow);
    margin-top: -2px;
  }
  .role-switcher {
    display: flex; gap: 2px; padding: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: var(--lz-radius-pill);
  }
  .role-pill {
    padding: 6px 14px; border-radius: var(--lz-radius-pill);
    font-size: var(--lz-fs-sm); font-weight: 500;
    color: rgba(255,255,255,0.7);
    transition: all var(--lz-dur-fast) var(--lz-ease);
    display: flex; align-items: center; gap: 6px;
  }
  .role-pill:hover { color: var(--lz-text-onbrand); }
  .role-pill.is-active {
    background: var(--lz-primary); color: var(--lz-text-onbrand);
    box-shadow: var(--lz-shadow-cta);
  }
  .topbar-right {
    margin-left: auto; display: flex; align-items: center; gap: var(--lz-space-5);
  }
  .clock {
    font-variant-numeric: tabular-nums; font-weight: 600;
    font-size: var(--lz-fs-sm);
  }
  .status-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--lz-fs-xs); color: rgba(255,255,255,0.7);
  }
  .status-dot::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--lz-success); box-shadow: 0 0 8px var(--lz-success);
  }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 4px;
    background: rgba(255,255,255,0.06); border-radius: var(--lz-radius-pill);
    font-size: var(--lz-fs-sm);
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #FED7AA, #C2410C);
    color: var(--lz-text-onbrand);
    display: grid; place-items: center;
    font-weight: 700; font-size: 12px;
  }

  /* ---------- Main layout ---------- */
  .page {
    max-width: 1400px; margin: 0 auto;
    padding: var(--lz-space-7);
    display: flex; flex-direction: column; gap: var(--lz-space-7);
  }
  .page-head { display: flex; align-items: flex-end; gap: var(--lz-space-5); flex-wrap: wrap; }
  .page-title { margin: 0; font-size: var(--lz-fs-h1); font-weight: 700; }
  .page-sub {
    margin: 4px 0 0; color: var(--lz-text-muted);
    font-size: var(--lz-fs-sm);
  }
  .page-head-actions { margin-left: auto; display: flex; gap: var(--lz-space-2); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: var(--lz-radius-sm);
    font-size: var(--lz-fs-sm); font-weight: 500;
    transition: all var(--lz-dur-fast) var(--lz-ease);
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--lz-primary); color: var(--lz-text-onbrand); }
  .btn-primary:hover {
    background: var(--lz-primary-dark);
    transform: translateY(-1px); box-shadow: var(--lz-shadow-sm);
  }
  .btn-ghost {
    background: var(--lz-card); color: var(--lz-text);
    border-color: var(--lz-border);
  }
  .btn-ghost:hover { background: var(--lz-bg); border-color: var(--lz-text-muted); }
  .btn-sm { padding: 6px 12px; font-size: var(--lz-fs-xs); }
  .btn-icon {
    width: 32px; height: 32px; padding: 0;
    display: inline-grid; place-items: center;
    background: var(--lz-bg); border-radius: var(--lz-radius-sm);
    color: var(--lz-text-muted);
  }
  .btn-icon:hover { background: var(--lz-border); color: var(--lz-text); }

  /* ---------- Card primitive ---------- */
  .card {
    background: var(--lz-card);
    border: 1px solid var(--lz-border);
    border-radius: var(--lz-radius);
    box-shadow: var(--lz-shadow-sm);
  }
  .card-head {
    display: flex; align-items: center; gap: var(--lz-space-3);
    padding: var(--lz-space-5) var(--lz-space-6);
    border-bottom: 1px solid var(--lz-border);
  }
  .card-title { font-size: var(--lz-fs-h4); font-weight: 700; margin: 0; }
  .card-sub  { font-size: var(--lz-fs-xs); color: var(--lz-text-muted); margin: 2px 0 0; }
  .card-head-actions { margin-left: auto; display: flex; gap: 4px; }
  .card-body { padding: var(--lz-space-5) var(--lz-space-6); }

  /* ---------- KPI row ---------- */
  .kpis {
    display: grid; gap: var(--lz-space-5);
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .kpi {
    padding: var(--lz-space-6); display: flex; flex-direction: column; gap: 6px;
    position: relative; overflow: hidden;
  }
  .kpi-eyebrow {
    font-size: var(--lz-fs-2xs); font-weight: 600;
    color: var(--lz-text-muted);
    text-transform: uppercase; letter-spacing: var(--lz-tracking-eyebrow);
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-value {
    font-size: 32px; font-weight: 800; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; gap: 6px;
    margin-top: 2px;
  }
  .kpi-unit { font-size: 14px; font-weight: 600; color: var(--lz-text-muted); }
  .kpi-foot {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
    margin-top: 4px;
  }
  .delta-up   { color: var(--lz-success); font-weight: 600; }
  .delta-down { color: var(--lz-danger);  font-weight: 600; }
  .kpi-spark {
    position: absolute; right: 14px; bottom: 14px;
    opacity: 0.5;
  }
  .kpi-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px;
    position: absolute; top: 16px; right: 16px;
  }
  .kpi-icon.warm   { background: var(--lz-primary-light); color: var(--lz-primary-dark); }
  .kpi-icon.green  { background: var(--lz-success-bg);    color: var(--lz-success); }
  .kpi-icon.amber  { background: var(--lz-warning-bg);    color: var(--lz-warning); }
  .kpi-icon.red    { background: var(--lz-danger-bg);     color: var(--lz-danger); }

  /* ---------- Two-column grid ---------- */
  .two-col {
    display: grid; gap: var(--lz-space-7);
    grid-template-columns: minmax(0, 1fr) 380px;
  }
  @media (max-width: 1100px) {
    .two-col { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ---------- Pipeline ---------- */
  .pipeline {
    display: grid; gap: var(--lz-space-4);
    grid-template-columns: repeat(4, minmax(0, 1fr));
    position: relative;
  }
  .pipe-stage {
    position: relative;
    border: 1px solid var(--lz-border); border-radius: var(--lz-radius);
    padding: var(--lz-space-5);
    background: var(--lz-bg-alt);
    display: flex; flex-direction: column; gap: 10px;
    transition: all var(--lz-dur-fast) var(--lz-ease);
  }
  .pipe-stage::after {
    content: "→";
    position: absolute; top: 50%; right: -18px;
    transform: translateY(-50%);
    color: var(--lz-text-muted); font-size: 18px; font-weight: 700;
  }
  .pipe-stage:last-child::after { display: none; }
  .pipe-stage.is-active { background: var(--lz-card); border-color: var(--lz-primary); box-shadow: var(--lz-shadow-sm); }
  .pipe-num {
    font-size: 28px; font-weight: 800; color: var(--lz-border);
    line-height: 1; font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }
  .pipe-stage.is-active .pipe-num { color: var(--lz-primary-light); }
  .pipe-title {
    font-size: var(--lz-fs-sm); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .pipe-items { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .pipe-item {
    display: flex; align-items: center; gap: 8px;
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
  }
  .pipe-item::before { content: "›"; color: var(--lz-primary); font-weight: 700; }
  .pipe-foot {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--lz-fs-2xs); font-weight: 600;
    margin-top: auto; padding-top: 8px;
    border-top: 1px dashed var(--lz-border);
    color: var(--lz-success);
  }
  .pipe-foot::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--lz-success);
    animation: lz-pulse 1.5s ease-in-out infinite;
  }
  @keyframes lz-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  @media (max-width: 900px) {
    .pipeline { grid-template-columns: repeat(2, 1fr); }
    .pipe-stage::after { display: none; }
  }

  /* ---------- Two-col side stacking ---------- */
  .col-left, .col-right {
    display: flex; flex-direction: column; gap: var(--lz-space-7);
    min-width: 0;
  }

  /* ---------- Signal filters (tabs) ---------- */
  .signal-filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 14px var(--lz-space-6) 0;
  }
  .filter-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--lz-radius-pill);
    background: transparent; color: var(--lz-text-muted);
    font-size: var(--lz-fs-sm); font-weight: 600;
    border: 1px solid var(--lz-border);
    transition: all var(--lz-dur-fast) var(--lz-ease);
  }
  .filter-tab:hover { background: var(--lz-bg); color: var(--lz-text); }
  .filter-tab.is-on {
    background: var(--lz-primary); color: var(--lz-text-onbrand);
    border-color: var(--lz-primary);
    box-shadow: var(--lz-shadow-cta);
  }
  .filter-count {
    display: inline-grid; place-items: center;
    min-width: 20px; padding: 0 4px; height: 18px;
    border-radius: var(--lz-radius-pill);
    background: rgba(255,255,255,0.25);
    font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .filter-tab:not(.is-on) .filter-count {
    background: var(--lz-bg); color: var(--lz-text-muted);
  }

  /* ---------- Signal list ---------- */
  .signal-list {
    display: flex; flex-direction: column;
    padding: 6px 0 6px;
  }
  .signal-empty {
    padding: var(--lz-space-7); text-align: center;
    color: var(--lz-text-muted); font-size: var(--lz-fs-sm);
  }
  .signal {
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    gap: var(--lz-space-4);
    align-items: flex-start;
    padding: var(--lz-space-5) var(--lz-space-6);
    border-top: 1px solid var(--lz-border);
    transition: background var(--lz-dur-fast) var(--lz-ease);
  }
  .signal:hover { background: var(--lz-bg-alt); }
  .signal[data-read="true"] { opacity: 0.62; }
  .signal-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--lz-bg); border: 1px solid var(--lz-border);
    display: grid; place-items: center; font-size: 18px;
  }
  .signal-body { min-width: 0; }
  .signal-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .signal-time {
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
    margin-left: 2px;
  }
  .signal-unread {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--lz-primary);
    box-shadow: 0 0 0 3px rgba(194,65,12,0.15);
    margin-left: auto;
  }
  .signal-title {
    font-size: var(--lz-fs-h4); font-weight: 700;
    line-height: var(--lz-lh-tight);
    margin-bottom: 4px;
    text-wrap: pretty;
  }
  .signal-text {
    font-size: var(--lz-fs-sm); color: var(--lz-text-muted);
    line-height: var(--lz-lh-normal);
    text-wrap: pretty;
  }
  .signal-foot {
    display: flex; align-items: center; gap: var(--lz-space-5);
    margin-top: 10px; flex-wrap: wrap;
  }
  .signal-source {
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
    font-weight: 500;
  }
  .signal-score {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: auto;
  }
  .signal-score .lz-eyebrow { font-size: 10px; }
  .score-bar {
    width: 80px; height: 6px; border-radius: 3px;
    background: var(--lz-bg); overflow: hidden;
  }
  .score-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--lz-gold), var(--lz-primary));
  }
  .score-val {
    font-size: var(--lz-fs-xs); font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--lz-text);
    min-width: 20px; text-align: right;
  }
  .signal-actions {
    display: flex; flex-direction: column; gap: 4px;
  }

  /* ---------- Sources grid ---------- */
  .sources-grid {
    display: grid; gap: 1px;
    grid-template-columns: repeat(2, 1fr);
    background: var(--lz-border);
    border-top: 1px solid var(--lz-border);
  }
  @media (max-width: 700px) { .sources-grid { grid-template-columns: 1fr; } }
  .source-row {
    background: var(--lz-card);
    display: grid;
    grid-template-columns: auto auto minmax(0,1fr) auto;
    align-items: center;
    gap: var(--lz-space-4);
    padding: var(--lz-space-5) var(--lz-space-6);
    transition: background var(--lz-dur-fast) var(--lz-ease);
  }
  .source-row:hover { background: var(--lz-bg-alt); }
  .source-no {
    font-size: var(--lz-fs-2xs); font-weight: 800;
    color: var(--lz-primary);
    font-variant-numeric: tabular-nums;
    width: 22px;
  }
  .source-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--lz-bg); border: 1px solid var(--lz-border);
    display: grid; place-items: center; font-size: 16px;
  }
  .source-name {
    font-size: var(--lz-fs-sm); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
    margin-bottom: 2px;
  }
  .source-sub {
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
  }
  .source-meta {
    display: flex; align-items: center; gap: var(--lz-space-3);
  }
  .source-rate {
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
    display: inline-flex; align-items: baseline; gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .source-rate b {
    color: var(--lz-text); font-size: var(--lz-fs-body);
    font-weight: 700;
  }
  .source-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: var(--lz-radius-pill);
    font-size: var(--lz-fs-2xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .source-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
  }

  /* ---------- Quick actions ---------- */
  .actions-list { padding: 6px 0; }
  .action-btn {
    width: 100%; display: flex; align-items: center; gap: var(--lz-space-4);
    padding: 12px var(--lz-space-6);
    text-align: left;
    transition: background var(--lz-dur-fast) var(--lz-ease);
    border-top: 1px solid var(--lz-border);
  }
  .actions-list li:first-child .action-btn { border-top: none; }
  .action-btn:hover { background: var(--lz-bg-alt); }
  .action-emoji {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--lz-primary-light); color: var(--lz-primary-dark);
    display: grid; place-items: center; font-size: 16px;
    flex-shrink: 0;
  }
  .action-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .action-label { font-size: var(--lz-fs-sm); font-weight: 600; color: var(--lz-text); }
  .action-sub   { font-size: var(--lz-fs-xs); color: var(--lz-text-muted); }
  .action-chev  { margin-left: auto; color: var(--lz-text-muted); font-size: 18px; }

  /* ---------- Activity list ---------- */
  .activity-list { padding: 6px 0; }
  .activity-row {
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    gap: 10px; align-items: center;
    padding: 10px var(--lz-space-6);
    font-size: var(--lz-fs-sm);
  }
  .activity-row:not(:first-child) { border-top: 1px dashed var(--lz-border); }
  .activity-emoji {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--lz-bg); border: 1px solid var(--lz-border);
    display: grid; place-items: center; font-size: 13px;
  }
  .activity-text { color: var(--lz-text); }
  .activity-time {
    font-size: var(--lz-fs-xs); color: var(--lz-text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Briefings ---------- */
  .brief-list { padding: 6px 0; }
  .brief-row {
    display: grid;
    grid-template-columns: auto minmax(0,1fr) auto;
    gap: var(--lz-space-3); align-items: center;
    padding: 12px var(--lz-space-6);
    transition: background var(--lz-dur-fast) var(--lz-ease);
  }
  .brief-row:hover { background: var(--lz-bg-alt); }
  .brief-row:not(:first-child) { border-top: 1px solid var(--lz-border); }
  .brief-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--lz-warning-bg); color: var(--lz-warning);
    display: grid; place-items: center; font-size: 15px;
  }
  .brief-title { font-size: var(--lz-fs-sm); font-weight: 600; }
  .brief-meta  { font-size: var(--lz-fs-xs); color: var(--lz-text-muted); margin-top: 2px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--lz-text); color: var(--lz-text-onbrand);
    padding: 12px 20px; border-radius: var(--lz-radius-pill);
    font-size: var(--lz-fs-sm); font-weight: 500;
    box-shadow: var(--lz-shadow-lg);
    animation: lz-fade-up 250ms var(--lz-ease) both;
    z-index: 200;
  }
  @keyframes lz-fade-up {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ---------- Fade-in on mount ---------- */
  #app > * { animation: lz-fade-up 250ms var(--lz-ease) both; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-tile">📡</div>
      <div>
        <div class="brand-name">Sinyal Paneli</div>
        <div class="brand-sub">Lezzet · Finansal İstihbarat</div>
      </div>
    </div>

    <nav class="role-switcher" id="role-switcher">
      <button class="role-pill is-active" data-role="dashboard">📊 Panel</button>
      <button class="role-pill" data-role="signals">🎯 Sinyaller</button>
      <button class="role-pill" data-role="sources">📥 Kaynaklar</button>
      <button class="role-pill" data-role="reports">📰 Raporlar</button>
    </nav>

    <div class="topbar-right">
      <span class="status-dot">Sistem Çalışıyor</span>
      <span class="clock" id="clock">14:32</span>
      <div class="user-chip">
        <div class="avatar">M</div>
        <span>Merhaba</span>
      </div>
    </div>

</header>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Live clock
  (function () {
    const el = document.getElementById('clock');
    function tick() {
      const d = new Date();
      el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    tick(); setInterval(tick, 30000);
  })();

  // Role switcher (visual only — no SPA routing for now)
  document.getElementById('role-switcher').addEventListener('click', (e) => {
    const btn = e.target.closest('.role-pill');
    if (!btn) return;
    document.querySelectorAll('.role-pill').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const role = btn.dataset.role;
    document.querySelectorAll('[data-section]').forEach(sec => {
      sec.style.display = (role === 'dashboard' || sec.dataset.section === role) ? '' : 'none';
    });
  });
</script>
